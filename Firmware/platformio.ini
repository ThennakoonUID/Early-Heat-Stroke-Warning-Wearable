; Heat-stroke early-warning monitor
; Board: ESP32 DevKit V1 (ESP32-WROOM-32)
; Sensors: MAX30102 + MPU6050 + SHT30 (I2C), 2 x NTC (GPIO34/35), GSR front end (GPIO25/16/17/32)
; No external libraries needed - every sensor uses a small register-level driver in include/

[env:esp32dev]
; Pinned to the 6.x line (Arduino-ESP32 2.x): GsrFrontEnd.h uses the classic
; driver/adc.h, driver/dac.h and esp_adc_cal.h APIs.
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino

; Must match kBaud in src/main.cpp and the baud selected in Teleplot.
; Close this serial monitor before connecting Teleplot.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -O2
